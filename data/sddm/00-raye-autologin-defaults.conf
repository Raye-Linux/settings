# Read before every other file of the sign-in screen (SDDM's system
# folder comes first). SDDM reads its files again when a session ends but
# keeps in memory every key no file names any more: without this, the one
# automatic sign-in of a desktop switch (zz-raye-switch.conf, removed once
# used) would stay on until SDDM restarts. These are SDDM's own defaults;
# any later file (automatic sign-in in Settings, Setup's sddm.conf) still
# decides. Settings > Personalization > Desktop environment.
[Autologin]
User=
Session=
Relogin=false
